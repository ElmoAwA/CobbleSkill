import org.jetbrains.kotlin.gradle.tasks.KotlinCompile

plugins {
    id 'fabric-loom' version '1.9-SNAPSHOT'
    id 'maven-publish'
    id "org.jetbrains.kotlin.jvm" version "2.1.0"
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}


repositories {
    maven { url 'https://maven.nucleoid.xyz' }
    maven { url 'https://maven.tomalbrc.de' }
    //maven { url = 'https://maven.impactdev.net/repository/development/' }
    maven {url = 'https://api.modrinth.com/maven'}
    mavenLocal()
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    modImplementation ("eu.pb4:polymer-core:${project.polymer_version}")
    modImplementation ("eu.pb4:polymer-blocks:${project.polymer_version}")
    modImplementation ("eu.pb4:polymer-resource-pack:${project.polymer_version}")
    modImplementation ("eu.pb4:polymer-virtual-entity:${project.polymer_version}")
    modImplementation ("eu.pb4:polymer-networking:${project.polymer_version}")
    modImplementation ("eu.pb4:polymer-autohost:${project.polymer_version}")

    modImplementation include("net.kyori:adventure-platform-fabric:${project.adventure_platform_version}")
    implementation include("net.kyori:adventure-text-minimessage:${project.adventure_api_version}")
    implementation include("net.kyori:adventure-text-serializer-legacy:${project.adventure_api_version}")
    implementation("net.kyori:adventure-api:${project.adventure_api_version}")

    implementation include('org.yaml:snakeyaml:2.4')
    implementation include('com.google.code.gson:gson-extras:2.13.2-rc1')

    modImplementation include("de.tomalbrc:blockbench-import-library:${project.bil_version}")
    modImplementation include("xyz.nucleoid:disguiselib:${project.disguiselib_version}")
    modImplementation include('me.lucko:fabric-permissions-api:0.3.1')
    modImplementation include('xyz.nucleoid:stimuli:0.4.12+1.21')

    modImplementation("net.fabricmc:fabric-language-kotlin:1.12.3+kotlin.2.0.21")
    modImplementation "maven.modrinth:cobblemon:s64m1opn"
}

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 21
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    if (targetJavaVersion >= 10 || JavaVersion.current().isJava10Compatible()) {
        it.options.release.set(targetJavaVersion)
    }
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }

    withSourcesJar()
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archivesBaseName}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    repositories {

    }
}
